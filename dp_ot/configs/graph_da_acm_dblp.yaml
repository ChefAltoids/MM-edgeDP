# Graph domain adaptation: ACMv9 (source) -> DBLPv7 (target).
# The canonical *covariate-shift* graph-transfer benchmark (shared feature +
# label space). Requires the .mat files under gda_root (not pip-installable;
# see colab_real_data.ipynb / load_graph_da for acquisition).

dataset: graph_da
gda_source: acmv9
gda_target: dblpv7
gda_root: data/graph_da
# Optional direct-download URLs (loader fetches if the .mat is absent):
gda_source_url: null
gda_target_url: null

K: 64
d_max: 20
B: 5.0
reweight_rho: 0.001

hidden: 128
num_layers: 2
epochs: 200
lr: 0.01
weight_decay: 0.0005
dropout: 0.5
device: cpu

epsilon: 1.0
seed: 0

# FGW alignment diagnostic (#1): adds the oracle_fgw method. Compare
# oracle_fgw vs oracle vs source_only. If oracle_fgw > source_only where
# oracle did not, the residual ACM->DBLP gap was frame MISALIGNMENT;
# if neither beats source_only, it confirms genuine concept shift.
# fgw_alpha=0.5 uses the shared BoW features AND relational structure; the
# correspondence is estimated with uniform marginals so the mass shift can't
# corrupt the geometric match (see tests/test_fgw_alignment.py).
run_fgw: true
fgw_alpha: 0.5
K_target: null
fgw_n_init: 10
