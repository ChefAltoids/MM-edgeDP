# Sweep config: Experiment 2 (shift decomposition — four regimes).
# Tests whether feature-OT and structural-OT diagnostics correctly separate regimes.

n_source: 1000
n_target: 500
M: 4
d_latent: 8
sigma: 0.5
edge_alpha: 0.5
edge_beta: -2.0
mean_scale: 2.0
gamma: 0.75   # shift magnitude within covariate-shift regimes

d_max: 10
B: 3.0
reweight_rho: 0.001

hidden: 64
num_layers: 2
epochs: 200
lr: 0.01
weight_decay: 0.0005
dropout: 0.5
device: cpu

out: dp_ot/outputs/sweep_shift_decomposition.csv

sweep:
  regime:  [no_shift, covariate_shift, structural_shift, both]
  epsilon: [0.3, 1.0, 3.0, 10.0]
  K:       [32]
  seed:    [0, 1, 2, 3, 4]
